<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR - MindAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>

    <script>
        // Компонент вешается на entity с mindar-image-target.
        // Пока таргет виден - копирует его актуальную мировую позицию
        // на отдельную "замороженную" модель. Когда таргет теряется,
        // MindAR прячет ТОЛЬКО свой якорь - "замороженная" модель
        // в это управление не входит и просто остаётся на месте,
        // в последней известной позиции.
        AFRAME.registerComponent('freeze-on-lost', {
            init: function () {
                this.tracking = false;
                this.frozen = document.querySelector('#arcaFrozen');

                this.el.addEventListener('targetFound', () => {
                    this.tracking = true;
                });

                this.el.addEventListener('targetLost', () => {
                    this.tracking = false;
                    // ничего больше не делаем - frozen остаётся видимой
                    // и не двигается дальше
                });
            },

            tick: function () {
                if (!this.tracking) return;

                this.el.object3D.updateMatrixWorld(true);
                this.frozen.object3D.matrix.copy(this.el.object3D.matrixWorld);
                this.frozen.object3D.matrix.decompose(
                    this.frozen.object3D.position,
                    this.frozen.object3D.quaternion,
                    this.frozen.object3D.scale
                );
                this.frozen.object3D.visible = true;
            }
        });
    </script>
</head>
<body>
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 100; missTolerance: 5; warmupTolerance: 5;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">

        <a-assets>
            <a-asset-item id="arcaModel" src="arcageo.glb"></a-asset-item>
        </a-assets>

        <!-- Камера MindAR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Якорь MindAR: сам по себе невидимый, нужен только чтобы знать текущую позицию цели -->
        <a-entity mindar-image-target="targetIndex: 0" freeze-on-lost></a-entity>

        <!-- Модель живёт ОТДЕЛЬНО от якоря, поэтому MindAR не может её спрятать -->
        <a-entity id="arcaFrozen" visible="false">
            <a-gltf-model
                src="#arcaModel"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-gltf-model>
        </a-entity>
    </a-scene>
</body>
</html>
