<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Arca AR - MindAR</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    
    <!-- A-Frame -->
    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <!-- MindAR library -->
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>

    <!-- Кастомный компонент для удержания модели на экране -->
    <script>
        AFRAME.registerComponent('keep-visible', {
            init: function () {
                // Как только маркер пропадает из виду, MindAR делает объект невидимым.
                // Мы слушаем это событие и принудительно возвращаем видимость.
                this.el.addEventListener('targetLost', () => {
                    this.el.setAttribute('visible', true);
                });
            }
        });
    </script>

    <style>
        body {
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>

<body>
    <a-scene
        mindar-image="imageTargetSrc: ./targets.mind; filterMinCF: 0.0001; filterBeta: 100; missTolerance: 5; warmupTolerance: 5;"
        color-space="sRGB"
        renderer="colorManagement: true, physicallyCorrectLights"
        vr-mode-ui="enabled: false"
        device-orientation-permission-ui="enabled: false">
        
        <a-assets>
            <!-- Загружаем модель -->
            <a-asset-item id="arcaModel" src="arcageo.glb"></a-asset-item>
        </a-assets>

        <!-- Камера MindAR -->
        <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

        <!-- Маркер. Добавляем сюда наш новый компонент keep-visible -->
        <a-entity mindar-image-target="targetIndex: 0" keep-visible>
            
            <!-- Ваша модель -->
            <a-gltf-model
                src="#arcaModel"
                position="0 0 0"
                scale="0.5 0.5 0.5"
                rotation="0 0 0">
            </a-gltf-model>

        </a-entity>
    </a-scene>
</body>
</html>
